<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kai 的個人介紹、興趣與社群連結">
  <title>Kai｜Personal Page</title>
  <style>
    :root {
      --pink-light: #fff1f5;
      --pink-dark: #a94f70;
      --ink: #28232a;
      --muted: #706871;
      --line: #eddce2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #fffafb;
      color: var(--ink);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    .page {
      width: min(760px, calc(100% - 40px));
      margin: auto;
      padding: 24px 0;
    }
    .hero { text-align: center; }
    .portrait {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 50%;
      background: var(--pink-light);
      box-shadow: 0 8px 24px #854e6229;
      display: grid;
      place-items: center;
    }
    .portrait span { font-size: 28px; color: var(--pink-dark); }
    .portrait img {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      object-fit: cover;
    }
    .hello {
      margin: 10px 0 2px;
      color: var(--pink-dark);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    h1 { margin: 0; font-size: 44px; line-height: 1.15; }
    .education { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }
    .card {
      padding: 18px 22px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .card-number { color: var(--pink-dark); font-size: 13px; letter-spacing: 2px; }
    .card h2 { margin: 4px 0 10px; font-size: 21px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .interest-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .interest-list li {
      padding: 5px 12px;
      background: var(--pink-light);
      color: var(--pink-dark);
      border-radius: 999px;
      font-size: 14px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      max-width: 100%;
      padding: 8px 16px;
      background: var(--pink-dark);
      color: white;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }
    .button span { overflow-wrap: anywhere; }
    .button:hover { background: #853b56; }
    .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .ig-icon { width: 21px; height: 21px; flex-shrink: 0; }
    .github-section {
      margin-top: 18px;
      padding: 18px 24px;
      background: var(--pink-light);
      border-radius: 14px;
      text-align: center;
    }
    .github-section h2 { margin: 0 0 4px; font-size: 23px; }
    .github-section p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    footer {
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    @media (max-width: 600px) {
      .page { width: calc(100% - 32px); padding: 20px 0; }
      .cards { grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
      .card { padding: 16px 20px; }
      h1 { font-size: 38px; }
      .portrait { width: 100px; height: 100px; }
    }
  </style>
</head>
